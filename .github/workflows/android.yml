name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: "13114758" # SDK command-line tools 19.0
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install native tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y glslang-tools
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Test, lint and build arm64 APK
        run: ./gradlew :core:test :app:lintDebug :app:assembleDebug :engine:assembleDebugAndroidTest :app:assembleDebugAndroidTest --stacktrace
      - name: Bundle matching source
        run: |
          python3 scripts/check_apk.py app/build/outputs/apk/debug/app-debug.apk
          python3 scripts/source_bundle.py --output distribution/SpektraLab-Android-source.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SpektraLab-Android-test-build
          path: |
            app/build/outputs/apk/debug/*.apk
            distribution/*.zip
            app/build/reports/lint-results-debug.html
            core/build/reports/tests/test
          if-no-files-found: error
          retention-days: 14
